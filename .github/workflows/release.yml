name: Release plugin
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0"
        default: "1.0.0"
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the plugin (files at the zip root)
        run: |
          NAME="${{ github.event.repository.name }}"
          zip -r "$NAME.zip" . -x ".git/*" ".github/*" "*.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          fi
          gh release create "$TAG" "${{ github.event.repository.name }}.zip" --title "$TAG" --generate-notes --target "${{ github.sha }}"
